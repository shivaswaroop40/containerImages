apiVersion: v1
kind: Pod
metadata:
  name: unsigned-image-pod
  labels:
    app: unsigned-app
    security: unsigned
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 3000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: unsigned-container
      # ${IMAGE_SHA} is substituted by `make deploy-unsigned TAG=sha-<sha>`.
      # With the cluster policy in place this Pod is REJECTED at admission -
      # that is the point of the demo.
      image: ghcr.io/shivaswaroop40/containerimages/unsigned:${IMAGE_SHA}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
  imagePullSecrets:
    - name: ghcr-secret
