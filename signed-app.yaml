apiVersion: v1
kind: Pod
metadata:
  name: signed-image-pod
  labels:
    app: signed-app
    security: signed
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 3000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: signed-container
      # ${IMAGE_SHA} is substituted by `make deploy-signed TAG=sha-<sha>`.
      # Kyverno's mutateDigest rewrites this tag to the verified digest at
      # admission.
      image: ghcr.io/shivaswaroop40/containerimages/signed:${IMAGE_SHA}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
  imagePullSecrets:
    - name: ghcr-secret
